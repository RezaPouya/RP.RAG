<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="2000" viewBox="0 0 1600 2000" role="img" aria-labelledby="title description">
  <title id="title">گردش کار RAG و محافظ‌های Laya در RP.RAG</title>
  <desc id="description">نمودار فارسی مسیر درخواست از API، سه مرحله محافظ Laya، بازیابی ترکیبی و تولید پاسخ را نشان می‌دهد.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M1,1 L11,6 L1,11 Z" fill="#64748b"/>
    </marker>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <style>
      text { font-family: "Segoe UI", Tahoma, Arial, sans-serif; fill: #172554; }
      .title { font-size: 42px; font-weight: 700; }
      .subtitle { font-size: 22px; fill: #475569; }
      .node-title { font-size: 28px; font-weight: 700; }
      .body { font-size: 20px; fill: #334155; }
      .small { font-size: 17px; fill: #475569; }
      .chip { font-size: 17px; font-weight: 600; }
      .step { font-size: 16px; font-weight: 700; }
    </style>
  </defs>

  <rect width="1600" height="2000" fill="#f8fafc"/>
  <circle cx="120" cy="160" r="90" fill="#dbeafe" opacity="0.55"/>
  <circle cx="1480" cy="1850" r="130" fill="#ccfbf1" opacity="0.55"/>

  <text x="800" y="100" text-anchor="middle" direction="rtl" class="title">گردش کار RAG و محافظ‌های Laya</text>
  <text x="800" y="145" text-anchor="middle" direction="rtl" class="subtitle">RP.RAG | از پرسش کاربر تا پاسخ مبتنی بر کاتالوگ محصولات</text>

  <!-- API entry -->
  <g filter="url(#shadow)">
    <rect x="530" y="190" width="540" height="100" rx="24" fill="#e0f2fe" stroke="#38bdf8" stroke-width="2"/>
  </g>
  <text x="800" y="232" text-anchor="middle" direction="rtl" class="node-title">درگاه API</text>
  <text x="800" y="265" text-anchor="middle" class="body">POST /api/ask</text>
  <path d="M800 292 L800 340" fill="none" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/>

  <!-- AskService boundary -->
  <rect x="175" y="350" width="1250" height="1500" rx="34" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2" stroke-dasharray="10 9"/>
  <rect x="575" y="328" width="450" height="52" rx="18" fill="#334155"/>
  <text x="800" y="363" text-anchor="middle" direction="rtl" font-size="24" font-weight="700" fill="#ffffff">جریان AskService</text>

  <!-- Stage 1 -->
  <g filter="url(#shadow)">
    <rect x="280" y="405" width="1040" height="175" rx="24" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/>
  </g>
  <rect x="1110" y="423" width="165" height="34" rx="17" fill="#ffedd5"/>
  <text x="1192" y="446" text-anchor="middle" direction="rtl" class="step" fill="#9a3412">مرحلهٔ ۱</text>
  <text x="800" y="463" text-anchor="middle" direction="rtl" class="node-title">محافظ ورودی با Laya</text>
  <text x="800" y="499" text-anchor="middle" direction="rtl" class="body">بررسی جیل‌بریک و تزریق در پرسش کاربر</text>
  <rect x="370" y="520" width="355" height="38" rx="19" fill="#fee2e2"/>
  <text x="547" y="546" text-anchor="middle" direction="rtl" class="small" fill="#991b1b">در صورت رد: توقف با پاسخ ۴۰۳</text>
  <rect x="875" y="520" width="355" height="38" rx="19" fill="#ffedd5"/>
  <text x="1052" y="546" text-anchor="middle" direction="rtl" class="small" fill="#9a3412">پیش از هرگونه بازیابی</text>

  <path d="M800 582 L800 620" fill="none" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/>

  <!-- Retrieval -->
  <g filter="url(#shadow)">
    <rect x="280" y="630" width="1040" height="150" rx="24" fill="#eef2ff" stroke="#818cf8" stroke-width="2"/>
  </g>
  <text x="800" y="677" text-anchor="middle" direction="rtl" class="node-title">بازیابی ترکیبی</text>
  <text x="800" y="711" text-anchor="middle" direction="rtl" class="body">جست‌وجوی واژگانی و معنایی، سپس ادغام رتبه‌ها</text>
  <rect x="450" y="730" width="250" height="34" rx="17" fill="#e0e7ff"/>
  <text x="575" y="753" text-anchor="middle" class="chip">Elasticsearch</text>
  <rect x="900" y="730" width="250" height="34" rx="17" fill="#e0e7ff"/>
  <text x="1025" y="753" text-anchor="middle" class="chip">PostgreSQL + pgvector</text>

  <path d="M800 782 L800 820" fill="none" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/>

  <!-- Stage 2 -->
  <g filter="url(#shadow)">
    <rect x="280" y="830" width="1040" height="220" rx="24" fill="#f0fdf4" stroke="#4ade80" stroke-width="2"/>
  </g>
  <rect x="1110" y="848" width="165" height="34" rx="17" fill="#dcfce7"/>
  <text x="1192" y="871" text-anchor="middle" direction="rtl" class="step" fill="#166534">مرحلهٔ ۲</text>
  <text x="800" y="887" text-anchor="middle" direction="rtl" class="node-title">ارزیابی قطعه‌ها با Laya</text>
  <text x="800" y="923" text-anchor="middle" direction="rtl" class="body">پرسش اصلی + متن هر قطعه: آیا برای پاسخ مفید است؟</text>
  <rect x="390" y="946" width="225" height="42" rx="18" fill="#dcfce7"/>
  <text x="502" y="974" text-anchor="middle" direction="rtl" class="chip" fill="#166534">مرتبط: نگه‌دار</text>
  <rect x="687" y="946" width="260" height="42" rx="18" fill="#fef3c7"/>
  <text x="817" y="974" text-anchor="middle" direction="rtl" class="chip" fill="#92400e">تاحدی مرتبط: نگه‌دار</text>
  <rect x="1018" y="946" width="225" height="42" rx="18" fill="#fee2e2"/>
  <text x="1130" y="974" text-anchor="middle" direction="rtl" class="chip" fill="#991b1b">نامرتبط: حذف</text>
  <text x="800" y="1024" text-anchor="middle" direction="rtl" class="small">بررسی جداگانهٔ تزریق؛ قطعهٔ علامت‌گذاری‌شده هم حذف می‌شود</text>

  <path d="M800 1052 L800 1090" fill="none" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/>

  <!-- Catalog -->
  <g filter="url(#shadow)">
    <rect x="280" y="1100" width="1040" height="135" rx="24" fill="#ecfeff" stroke="#22d3ee" stroke-width="2"/>
  </g>
  <text x="800" y="1148" text-anchor="middle" direction="rtl" class="node-title">دریافت کارت محصولات</text>
  <text x="800" y="1185" text-anchor="middle" direction="rtl" class="body">اطلاعات ساخت‌یافتهٔ محصول از PostgreSQL</text>

  <path d="M800 1237 L800 1275" fill="none" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/>

  <!-- Context assembly -->
  <g filter="url(#shadow)">
    <rect x="280" y="1285" width="1040" height="135" rx="24" fill="#f5f3ff" stroke="#a78bfa" stroke-width="2"/>
  </g>
  <text x="800" y="1332" text-anchor="middle" direction="rtl" class="node-title">ساخت متن و زمینهٔ مدل</text>
  <text x="800" y="1370" text-anchor="middle" direction="rtl" class="body">دستورهای مورد اعتماد + پرسش اصلی + قطعه‌های تأییدشده</text>

  <path d="M800 1422 L800 1460" fill="none" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/>

  <!-- Stage 3 -->
  <g filter="url(#shadow)">
    <rect x="280" y="1470" width="1040" height="180" rx="24" fill="#fdf2f8" stroke="#f472b6" stroke-width="2"/>
  </g>
  <rect x="1110" y="1488" width="165" height="34" rx="17" fill="#fce7f3"/>
  <text x="1192" y="1511" text-anchor="middle" direction="rtl" class="step" fill="#9d174d">مرحلهٔ ۳</text>
  <text x="800" y="1528" text-anchor="middle" direction="rtl" class="node-title">محافظ نهایی با Laya</text>
  <text x="800" y="1564" text-anchor="middle" direction="rtl" class="body">بررسی متن نهایی و زمینه از نظر جیل‌بریک و تزریق</text>
  <rect x="410" y="1585" width="780" height="42" rx="19" fill="#fee2e2"/>
  <text x="800" y="1613" text-anchor="middle" direction="rtl" class="small" fill="#991b1b">در صورت رد: پاسخ ۴۰۳ و عدم فراخوانی مدل تولیدکننده</text>

  <path d="M800 1652 L800 1700" fill="none" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/>

  <!-- Generator -->
  <g filter="url(#shadow)">
    <rect x="280" y="1710" width="1040" height="125" rx="24" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
  </g>
  <text x="800" y="1757" text-anchor="middle" direction="rtl" class="node-title">تولید پاسخ</text>
  <rect x="510" y="1775" width="210" height="38" rx="19" fill="#dbeafe"/>
  <text x="615" y="1801" text-anchor="middle" class="chip">Ollama</text>
  <rect x="880" y="1775" width="210" height="38" rx="19" fill="#dbeafe"/>
  <text x="985" y="1801" text-anchor="middle" class="chip">DeepSeek</text>

  <path d="M800 1837 L800 1880" fill="none" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/>

  <!-- Response -->
  <g filter="url(#shadow)">
    <rect x="530" y="1890" width="540" height="78" rx="24" fill="#dcfce7" stroke="#34d399" stroke-width="2"/>
  </g>
  <text x="800" y="1938" text-anchor="middle" direction="rtl" class="node-title">پاسخ + ارجاع محصولات</text>
</svg>
